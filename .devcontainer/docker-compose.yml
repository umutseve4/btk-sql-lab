services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Disposable local-only credential. Override MSSQL_SA_PASSWORD when needed.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Btk_Lab_2026!}"
      MSSQL_PID: "Developer"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd;
          "$$SQLCMD" -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 10s
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
